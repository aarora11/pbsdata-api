x-app: &app
  build: .
  image: pbsdata-api:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql://pbsapi:pbsapi@postgres:5432/pbsapi
  # The ingest archives older raw months here and deletes them from Postgres, so this
  # must outlive the container. See ingest/raw_archive.py.
  volumes:
    - ./data/raw_archive:/app/data/raw_archive
  depends_on:
    postgres:
      condition: service_healthy

services:
  # Real ingested PBS data (2026-05, 2026-06). Backed by the external volume
  # pbsdata_fresh_pgdata, which predates this stack — see volumes: below.
  postgres:
    image: postgres:16-alpine
    # The 1 GB default max_wal_size kept a full 1 GB of WAL on disk. Monthly bulk
    # loads don't need it; this only makes checkpoints more frequent during an ingest.
    command: ["postgres", "-c", "max_wal_size=256MB"]
    environment:
      POSTGRES_USER: pbsapi
      POSTGRES_PASSWORD: pbsapi
      POSTGRES_DB: pbsapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pbsapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate empty database for the test suite. The suite inserts fixtures and
  # counts rows, so it must not run against postgres: the real data collides
  # with those counts (10 failures).
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pbsapi
      POSTGRES_PASSWORD: pbsapi
      POSTGRES_DB: pbsapi
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pbsapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    command: python scripts/migrate.py
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # Run tests: docker compose run --rm test
  # Run specific file: docker compose run --rm test pytest tests/test_comprehensive.py -v
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: tester
    image: pbsdata-api:test
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pbsapi:pbsapi@postgres-test:5432/pbsapi
      PYTHONPATH: /app
    command: ["python", "-m", "pytest", "tests/", "-v", "--tb=short"]
    volumes:
      - ./tests:/app/tests
    depends_on:
      postgres-test:
        condition: service_healthy
    restart: "no"
    profiles:
      - test

  # Run manually: docker compose run --rm ingest
  # With a specific month: docker compose run --rm ingest 2026-04
  ingest:
    <<: *app
    entrypoint: ["python", "scripts/run_ingest.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles:
      - ingest

volumes:
  # Declared external so compose adopts the existing volume in place rather than
  # creating an empty one, and so `compose down -v` cannot drop the real data.
  pgdata:
    external: true
    name: pbsdata_fresh_pgdata
  pgdata_test:
