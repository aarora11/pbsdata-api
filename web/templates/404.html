{% extends "base.html" %}
{% block main %}
<section class="wrap notfound">
  <h1>We couldn't find that page</h1>
  <p class="lede">It may be a medicine that is no longer on the PBS, or a mistyped address. Try searching instead.</p>
  <form class="search search-hero" role="search" action="/" data-search>
    <svg class="search-icon" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/></svg>
    <input type="search" name="q" placeholder="Search a medicine, brand or item code" aria-label="Search medicines" autocomplete="off">
    <ul class="results" role="listbox" hidden></ul>
  </form>
  <p class="meta-line"><a href="/">Back to the home page</a></p>
</section>
{% endblock %}
